# Hindi number lexicon.
#
# Devanagari is the PRIMARY form: Sarvam returns Devanagari for hi-IN, so that
# is what the extractor actually meets. Romanized spellings are aliases for
# code-mixed output and for hand-written fixtures.
#
# Hindi 1-99 is NOT compositional -- there is no "twenty"+"one" rule, every
# value has its own word -- so all 100 are enumerated. Spelling variance around
# these forms (teen/theen/tin, hazaar/hajar) is absorbed by the canonicalizer in
# numwords/__init__.py; only genuinely distinct stems need listing here.

language: hi
script: devanagari
native_digits: "०१२३४५६७८९"

units:
  0:  [शून्य, सुन्न, zero, shunya, sunya]
  1:  [एक, ek, ik, ake]
  2:  [दो, do, doh, दौ]
  3:  [तीन, teen, theen, tin]
  4:  [चार, char, chaar]
  5:  [पाँच, पांच, panch, paanch, paach]
