# Indian grouping: hundred, thousand, lakh (10^5), crore (10^7), arab (10^9).
# There is deliberately no million/billion here -- assuming western grouping is
# exactly the bug this project exists to catch.
scales:
  - {value: 100,        words: [सौ, sau, so]}
  - {value: 1000,       words: [हज़ार, हजार, hazar, hazaar, hajar, thousand]}
  - {value: 100000,     words: [लाख, lakh, lac, lakhs]}
  - {value: 10000000,   words: [करोड़, करोड, crore, karod, crores]}
  - {value: 1000000000, words: [अरब, arab, arb]}

# Standalone fractional values -- these REPLACE the number, they do not modify
# a following one. "डेढ़ लाख" is 1.5 lakh, not "one and a half of a lakh unit".
fraction_values:
  - {value: 1.5, words: [डेढ़, डेढ, derh, dedh, deodh, dhed]}
  - {value: 2.5, words: [ढाई, ढाइ, dhai, dhaai, adhai]}

# Prefix modifiers applied to the value that FOLLOWS them.
# साढ़े तीन लाख = (3 + 0.5) * 100000 = 350000
# सवा लाख      = (1 + 0.25) * 100000 = 125000   (bare scale implies 1)
# पौने दो लाख  = (2 - 0.25) * 100000 = 175000
modifiers:
  - {delta:  0.5,  words: [साढ़े, साढे, sade, saadhe, sadhe, sarhe]}
  - {delta:  0.25, words: [सवा, सव्वा, sawa, sava, savva]}
  - {delta: -0.25, words: [पौने, पौना, paune, pone, pauna]}

# The currency word itself is often dropped by the recogniser -- the template
# says "{amount} रुपये की शेष राशि" and the transcript comes back "{amount} की
# शेष राशि". Financial context words are therefore cues too: without them an
# amount with no रुपये beside it is extracted as nothing at all.
currency_cues: [रुपये, रुपए, रूपये, रुपया, रुपयों, rupaye, rupay, rupee, rupees, rs, inr,
                राशि, बकाया, बैलेंस, शेष, जमा, भुगतान, क्रेडिट, डेबिट, लेनदेन, किस्त,
                balance, credit, debit, payment, outstanding, emi]
paise_cues: [पैसे, पैसा, paise, paisa]
decimal_cues: [दशमलव, point, dashamlav]

# Digit-string reading: "डबल पाँच" = 55, spoken in OTPs and account numbers.
repeat_words:
  - {times: 2, words: [डबल, double, dabal]}
  - {times: 3, words: [ट्रिपल, triple, tripal]}

# Cue words that identify which kind of digit run follows.
entity_cues:
  otp: [ओटीपी, otp, ओ.टी.पी, कोड, code, वन, टाइम, ओटीपि]
  account_number: [खाता, खाते, अकाउंट, account, अकाउन्ट, खाता संख्या, acct, a/c]
  pin_code: [पिन, पिनकोड, pin, pincode, पिन कोड, डाक]

months:
  1:  [जनवरी, january, jan]
  2:  [फ़रवरी, फरवरी, february, feb]
  3:  [मार्च, march, mar]
  4:  [अप्रैल, april, apr]
  5:  [मई, may]
  6:  [जून, june, jun]
  7:  [जुलाई, july, jul]
  8:  [अगस्त, august, aug]
  9:  [सितंबर, सितम्बर, september, sept, sep]
  10: [अक्टूबर, अक्तूबर, october, oct]
  11: [नवंबर, नवम्बर, november, nov]
  12: [दिसंबर, दिसम्बर, december, dec]
