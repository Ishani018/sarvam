# telephony-entity-eval -- default run configuration.
#
# Conditions are data. Adding a telephony condition means editing this file,
# never touching Python. Each condition is an ordered chain of transforms;
# every step is shelled out to ffmpeg/sox and its argv is logged to a manifest
# next to the output file.

seed: 1337

paths:
  corpus: fixtures/utterances.jsonl
  work_dir: .tee/work
  out_dir: results

audio:
  sample_rate: 16000      # canonical rate handed to ASR
  channels: 1
  sample_format: s16le
  frame_ms: 20            # packet-loss frame size
  restore_rate: true      # upsample degraded audio back to sample_rate

providers:
  asr:
    impl: mock            # mock | sarvam ; --provider overrides
    sarvam:
      endpoint: https://api.sarvam.ai/speech-to-text
      # Model is an axis, not a setting: v4 adds telephony-tuned handling and
      # entity preservation, which is the thing being measured, so it has to be
      # compared against v3 rather than swapped in. Each model multiplies the
      # ASR call count -- check `tee run --dry-run` before spending.
      models: [saaras:v3, saaras:v4]
      mode: transcribe    # transcribe normalizes numbers to digits;
                          # verbatim keeps spoken number words. See README.
      timeout_s: 120
      max_retries: 4
      backoff_base_s: 2.0
  tts:
    impl: mock
    sarvam:
      endpoint: https://api.sarvam.ai/text-to-speech
      model: bulbul:v3
      speaker: shubh            # lowercase; speaker names are case-sensitive
      speech_sample_rate: 24000 # 8000 is supported natively -- deliberately
                                # unused, so degrade.py stays the only thing
                                # controlling the independent variable
      pace: 1.0
      timeout_s: 120
      max_retries: 4
      backoff_base_s: 2.0
  cache:
    enabled: true
    dir: .tee/cache
    raw_dir: .tee/raw_responses

scoring:
  entity_types: [account_number, currency, otp, pin_code, date]
  wer:
    strip_punct: true
    unicode_nfc: true
    casefold: true

conditions:
  - name: clean
    description: 16 kHz mono baseline, no telephony damage
    chain:
      - {op: resample, rate: 16000}

  - name: narrowband
    description: 8 kHz downsample only -- isolates bandwidth loss from codec loss
    chain:
      - {op: resample, rate: 8000}

  - name: g711_ulaw
    description: 8 kHz + G.711 mu-law round trip (the standard PSTN codec)
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}

  # Was gsm_fr. libgsm is an optional ffmpeg dependency and is absent from
  # stock macOS and many distro builds, so the condition could be declared but
  # not run. G.726 is ITU-standard telephony ADPCM, compiled into ffmpeg with
  # no external library, and at 16 kbit/s it is comparably aggressive.
  - name: g726_16k
    description: 8 kHz + G.726 ADPCM at 16 kbit/s (DECT and legacy trunk codec)
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: g726, container: wav, bitrate: 16k}

  - name: opus_low
    description: low bitrate Opus round trip (VoIP / WebRTC under congestion)
    chain:
      - {op: codec, codec: libopus, container: ogg, bitrate: 12k, application: voip}

  # Loss conditions come in matched pairs: the same nominal rate under
  # independent per-frame loss and under bursty loss. The comparison is the
  # point. Scattered 20 ms dropouts leave intact context either side of every
  # hole; a 100 ms burst removes about a syllable, which is roughly one spoken
  # digit. If the first survives and the second does not, that says something
  # about how much the model is recovering from context rather than from audio.
  - name: packet_loss_2
    description: g711_ulaw + 2% frame loss, independent per frame
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}
      - {op: packet_loss, rate: 0.02, frame_ms: 20, fill: silence, model: bernoulli}

  - name: packet_loss_5
    description: g711_ulaw + 5% frame loss, independent per frame
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}
      - {op: packet_loss, rate: 0.05, frame_ms: 20, fill: silence, model: bernoulli}

  - name: packet_loss_burst_5
    description: >
      g711_ulaw + 5% frame loss arriving in bursts (Gilbert, mean 100 ms).
      The same nominal loss as packet_loss_5, in roughly a fifth as many holes.
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}
      - {op: packet_loss, rate: 0.05, frame_ms: 20, fill: silence,
         model: gilbert, mean_burst_ms: 100}

  - name: packet_loss_10
    description: g711_ulaw + 10% frame loss, independent per frame
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}
      - {op: packet_loss, rate: 0.10, frame_ms: 20, fill: silence, model: bernoulli}

  - name: packet_loss_burst_10
    description: g711_ulaw + 10% frame loss in bursts (Gilbert, mean 100 ms)
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}
      - {op: packet_loss, rate: 0.10, frame_ms: 20, fill: silence,
         model: gilbert, mean_burst_ms: 100}

  - name: packet_loss_burst_5_repeat
    description: >
      packet_loss_burst_5 with the previous good frame held over the gap
      instead of silence, which is what many jitter buffers actually do.
    chain:
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}
      - {op: packet_loss, rate: 0.05, frame_ms: 20, fill: repeat,
         model: gilbert, mean_burst_ms: 100}

  - name: noisy_line
    description: >
      pink noise at 15 dB SNR, then the phone line. Noise is added before the
      codec because that is the physical order: noisy room, then G.711.
    chain:
      - {op: noise, source: pink, snr_db: 15}
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}

  - name: noisy_line_snr5
    description: >
      pink noise at 5 dB SNR, then the phone line. Ten decibels harsher than
      noisy_line: a call from a street or a busy branch rather than a room.
    chain:
      - {op: noise, source: pink, snr_db: 5}
      - {op: resample, rate: 8000}
      - {op: codec, codec: pcm_mulaw, container: wav}

cost:
  asr_inr_per_audio_second: 0.00833
  tts_inr_per_1k_chars: 3.0
