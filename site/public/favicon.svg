    <line x1="32" y1="8" x2="32" y2="56"/>
    <line x1="46.375" y1="8" x2="46.375" y2="56"/>
    <line x1="60.75" y1="8" x2="60.75" y2="22"/>
    <line x1="60.75" y1="42" x2="60.75" y2="56"/>
  </g>
</svg>
