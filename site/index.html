<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fcfaf7" />
    <title>Ginti — entity accuracy under telephony degradation</title>
    <meta name="description" content="Voice agents read out account numbers and amounts over phone lines. Nobody measures whether the digits survive. Ginti does." />

    <!-- The page is noindex, but these still drive the preview card in Slack,
         WhatsApp and LinkedIn, which is where the link actually travels.
         Deliberately no figure: this file is static and is not generated by the
         build, so a number here would be the one claim on the site that could
         go stale without anything noticing. The preview carries the problem;
         the message carries the number. The card image is a different matter:
         it is regenerated from the data by `npm run card`, and scripts/card.mjs
         checks that the alt text below still agrees with it. -->
    <meta property="og:title" content="Nobody measures whether the digits survive" />
    <meta property="og:description" content="Voice agents read out account numbers and amounts over phone lines. Ginti is an open eval harness that measures whether they survive real telephony degradation." />
    <meta property="og:type" content="website" />

    <!-- Generated by `npm run card` from card.html and committed, because the
         build machine has no browser to render it. Root-relative rather than
         document-relative: scrapers are inconsistent about resolving the
         latter, and this deploys at a domain root. -->
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A rupee amount from the run, before and after a degraded phone line: 797 heard on a clean line becomes 700 on a bad one, with the wrong digits marked. Saaras holds entity accuracy through 8 kHz, G.711, G.726 and scattered packet loss; bursty packet loss costs it 22.8 points." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
